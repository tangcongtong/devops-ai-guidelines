name: Sync fork (multi-branch) from upstream

on:
  schedule:
    - cron: "0 0 * * 0"   # 30 phút/lần (UTC) ~ mỗi 30 phút +7h ở VN
  workflow_dispatch: {}       # Cho phép bấm chạy tay

permissions:
  contents: write

env:
  UPSTREAM_OWNER: VersusControl
  UPSTREAM_REPO:  devops-ai-guidelines

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [main, docs]   # Thêm tên nhánh khác nếu sau này repo có thêm
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git
          git fetch upstream --prune --tags

      # Nếu nhánh chưa tồn tại trong fork, tạo từ upstream
      - name: Ensure branch exists locally (create from upstream if missing)
        run: |
          BR=${{ matrix.branch }}
          if git show-ref --verify --quiet refs/heads/$BR; then
            echo "Local branch $BR exists."
          else
            echo "Create local branch $BR from upstream/$BR"
            git checkout -b $BR upstream/$BR
          fi

      - name: Fast-forward ${{ matrix.branch }} from upstream
        run: |
          BR=${{ matrix.branch }}
          git checkout $BR
          # Thử fast-forward; nếu không FF được (lịch sử lệch) thì bỏ qua để an toàn
          if git merge --ff-only upstream/$BR; then
            echo "Fast-forward $BR OK"
          else
            echo "Cannot fast-forward $BR (diverged). Skipping to avoid overwriting."
            exit 0
          fi

      - name: Push ${{ matrix.branch }} + tags
        run: |
          BR=${{ matrix.branch }}
          git push origin $BR
          git push --tags || true
